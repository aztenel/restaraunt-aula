# Prometheus AULA (docker-compose.monitoring.yml). Цели — сервисы production-стека в сети Docker aula-net.
# Внешняя доступность (web/admin/api через DNS и TLS, SLO 99,5 %) — Uptime Kuma, желательно с другого сервера.
# Проверка: promtool check config ops/monitoring/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Метрики API: HTTP (латентность, 5xx), outbox, очередь неудач, Node.js. Защищены METRICS_TOKEN.
  - job_name: aula-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    dns_sd_configs:
      # Все реплики api (docker compose --scale api=N) — через DNS Docker.
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 30s

  # Готовность изнутри сети: API /health/ready (БД + Redis), витрина, админка.
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:3000/api/v1/health/ready
        labels:
          service: api
      - targets:
          - http://web:3001/
        labels:
          service: web
      - targets:
          - http://admin:8080/healthz
        labels:
          service: admin
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Reverse proxy: запросы и коды ответов на входе (в т.ч. 502, когда upstream недоступен).
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  # Хост: диск, память, CPU + метрики бэкапа (textfile collector: aula_backup_*).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
