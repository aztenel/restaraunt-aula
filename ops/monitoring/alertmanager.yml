# Alertmanager AULA → Telegram. Шаблон: при старте контейнера плейсхолдеры __TELEGRAM_BOT_TOKEN__,
# __TELEGRAM_CHAT_ID__, __DEPLOY_ENV__ заменяются значениями из env/monitoring.env
# (Alertmanager не поддерживает переменные окружения в конфигурации). См. docker-compose.monitoring.yml.
# Бот и чат создаются на аккаунт клиента (не разработчика); бота добавляют в чат дежурных.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "critical"]
      receiver: telegram
      repeat_interval: 1h

inhibit_rules:
  # API недоступен — не дублировать производными алертами (витрина, 5xx, outbox и т.п.).
  - source_matchers: [alertname =~ "AulaApiDown|AulaApiNotReady"]
    target_matchers: [alertname =~ "AulaWebDown|AulaAdminDown|AulaHigh5xxRate|AulaApiLatencyP95High|AulaProxyUpstreamErrors|AulaOutboxLag|AulaOutboxBacklog"]
  # Критический алерт подавляет предупреждение с тем же именем.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        # Обычный текст: описания алертов содержат символы < > &, недопустимые в HTML-режиме Telegram.
        parse_mode: ""
        message: |-
          {{ if eq .Status "firing" }}[ПРОБЛЕМА]{{ else }}[РЕШЕНО]{{ end }} AULA __DEPLOY_ENV__: {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
            {{ .Annotations.description }}
          {{ end }}
